!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Small Ping Pong</title>

    <style>
        *{
            box-sizing: border-box;

        }

        html,body{
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: #191919;
        }

        canvas{
            display: block;
            width: 100%;
            height: 100%;
            cursor: none;

        }

    </style>
</head>

<body>
    <canvas id="game"></canvas>

    <script>
        const canvas=document.getElementById("game");
        const ctx=canvas.getContext("2D");
        let W,H;

        let state=0;
        let score=0;
        const ball={
            x:0,
            y:0,
            r:9,
            vx:4,
            vy:4
        };


        const paddle={
            x:0,
            y:0,
            w:120,
            h:20
        };


        function resize() {
            W=canvas.width=window.innerWidth;
            H=canvas.height=innerHeight;

            paddle.y= H-50;

        }
        window.addEventListener("resize",resize);


        function reset(){

            ball.x=W/1.5;
            ball.y=H/2;
            ball.vx=4;
            ball.vy=4;

            paddle.x=W/1.5;
            paddle.y= H-50;

            score= 0;


        }


        function movePaddle(x){
            paddle.x=x-paddle.w/2;
            
            if(paddle.x<0){
                paddle.x=0;
            }
            if(paddle.x+paddle.w>W){
                paddle.x=W-paddle.w;
            }

        }


        canvas.addEventListener("mousemove",function(e) {
            mousePaddle(e.clientX);
        });


        canvas.addEventListener("touchmove",e=>{
            movePaddle(e.touches[0].clientX);
            e.preventDefault();
        },{passive:false});


        function click(){

            if(state===0){
                state=1;
            }
            else if(state===2){
                reset();
                state=1;
            }
        }

        canvas.addEventListener("click",click);

        canvas.addEventListener("touchstart",e=>{
            click();
            e.preventDefault();
        },{passive:false});

        function update(){

            if(state!==1)
            return;

            ball.x+=ball.vx;
            ball.y+=ball.vy;

            if(ball.x-ball.r<=0){
                ball.x=ball.r;
                ball.vx*=-1;
            }

            if(ball.x+ball.r>=W){
                ball.x=W-ball.r;
                ball.vx*=-1;

            }

            if(ball.y-ball.r<=0){
                ball.y=ball.r;
                ball.vy*=-1;
            }

            if(
                ball.y+ball.r>paddle.y &&
                ball.y-ball.r<=paddle.y+paddle.h &&
                ball.x>=paddle.x &&
                ball.x<=paddle.x+paddle.w &&
                ball.vy>0
            ){
                ball.y=paddle.y-ball.r;
                ball.vy*=-1;
                const hit=H(ball.x-(paddle.x+paddle.w/2))
                /(paddle.w/2);
                ball.vx=hit*7;

                score++;
            }

            if(ball.y-ball.r>H){
                state=2;
            }
        }

        function draw(){
            ctx.clearRect(0,0,W,H);

            ctx.beginPath();
            ctx.arc(
                ball.x,
                ball.y,
                ball.r,
                0,
                Math.PI*2
            );


            ctx.fillStyle="#fff";

            ctx.fillRect(
                paddle.x,
                paddle.y,
                paddle.w,
                paddle.h
            );


            ctx.font="24px system-ui";
            ctx.textAlign="center";
            ctx.fillText(score,W/2,40);





            if(state=0){
                ctx.font="20px system-ui";

                ctx.fillText(
                    "CLICK TO START....",
                    W/2,
                    H/2
                );
            }



            if(state===2){

                ctx.font="32px system-ui";

                ctx.fillText(
                    "SKIBIDI AURA LOSS INFINITE....",
                    W/2,
                    H/2
                );

                ctx.fillText(
                    "CLICK TO RESTART (since u lost..)",
                    W/2,
                    H/2+35
                );
            }
        }


        function loop(){
            update();
            draw();
            requestAnimationFrame(loop);
        }

        resize();
        reset();
        loop();
    </script>
</body>
</html>
